# qtienda.shop — nginx reverse proxy
# Referencia de la configuración activa en /etc/nginx/sites-available/qtienda
# SSL gestionado por Certbot (no modificar los bloques marcados con "managed by Certbot")

server {
    # *.qtienda.shop: cada tienda vive en su propio subdominio (slug.qtienda.shop).
    # El ruteo slug → /tienda/slug lo resuelve el middleware de Next.js, acá solo
    # hace falta aceptar el host y servir el mismo certificado wildcard.
    server_name qtienda.shop www.qtienda.shop *.qtienda.shop;

    # www → apex: sin este redirect, qtienda.shop y www.qtienda.shop sirven
    # el mismo contenido en dos URLs distintas sin ninguna señal de cuál es
    # la canónica — Google Search Console lo marca como "Duplicada: el
    # usuario no ha indicado ninguna versión canónica" y no indexa ninguna
    # de las dos. Debe ir ANTES de las demás location, a nivel de server.
    if ($host = www.qtienda.shop) {
        return 301 https://qtienda.shop$request_uri;
    }

    # Uploads: servidos directamente por nginx desde disco (más eficiente que pasar por la API)
    # El docker-compose monta ./data/uploads en /app/data/uploads dentro del container,
    # pero nginx del host lee desde el path físico del VPS.
    location /uploads/ {
        alias /opt/qtienda/data/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Healthcheck del API (para smoke tests y monitoreo externo)
    location = /health {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # API (FastAPI en container qtienda_api → 127.0.0.1:8001)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Frontend (Next.js en container qtienda_web → 127.0.0.1:3001)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    # Certificado WILDCARD. Certbot lo guardó como "qtienda.shop-0001" (no
    # "qtienda.shop") porque el set de dominios del pedido cambió (se sacó
    # www.qtienda.shop, redundante con el wildcard) — --expand no reutilizó
    # el nombre anterior en ese caso.
    ssl_certificate     /etc/letsencrypt/live/qtienda.shop-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qtienda.shop-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    # HTTP → HTTPS para el apex, www y cualquier subdominio de tienda.
    listen 80;
    server_name qtienda.shop www.qtienda.shop *.qtienda.shop;
    return 301 https://$host$request_uri;
}
