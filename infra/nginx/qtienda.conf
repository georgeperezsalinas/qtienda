# qtienda.shop — nginx reverse proxy
# Referencia de la configuración activa en /etc/nginx/sites-available/qtienda
# SSL gestionado por Certbot (no modificar los bloques marcados con "managed by Certbot")

server {
    server_name qtienda.shop www.qtienda.shop;

    # Uploads: servidos directamente por nginx desde disco (más eficiente que pasar por la API)
    # El docker-compose monta ./data/uploads en /app/data/uploads dentro del container,
    # pero nginx del host lee desde el path físico del VPS.
    location /uploads/ {
        alias /opt/qtienda/data/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # API (FastAPI en container qtienda_api → 127.0.0.1:8001)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Frontend (Next.js en container qtienda_web → 127.0.0.1:3001)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/qtienda.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qtienda.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.qtienda.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = qtienda.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name qtienda.shop www.qtienda.shop;
    return 404; # managed by Certbot
}
