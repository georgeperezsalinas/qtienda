# ============================================================
# siscont-erp.com — proxy cuando los containers están activos (puerto 8080)
# Si siscont no está corriendo, nginx devuelve 502 automáticamente
# ============================================================

server {
    listen 443 ssl http2;
    server_name www.siscont-erp.com;
    ssl_certificate     /etc/letsencrypt/live/siscont-erp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siscont-erp.com/privkey.pem;
    return 301 https://siscont-erp.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name siscont-erp.com;

    ssl_certificate     /etc/letsencrypt/live/siscont-erp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siscont-erp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
