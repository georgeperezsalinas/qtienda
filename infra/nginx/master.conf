# ============================================================
# Nginx MAESTRO del VPS — todos los dominios en un solo archivo
# Copiar a /etc/nginx/sites-available/master.conf
# Activar: sudo ln -sf /etc/nginx/sites-available/master.conf /etc/nginx/sites-enabled/
# IMPORTANTE: deshabilitar el bloque default de nginx antes de activar esto
#   sudo rm -f /etc/nginx/sites-enabled/default
# ============================================================

# ── Redirigir todo HTTP → HTTPS ─────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ============================================================
# qtienda.shop
# ============================================================

server {
    listen 443 ssl http2;
    server_name www.qtienda.shop;
    ssl_certificate     /etc/letsencrypt/live/qtienda.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qtienda.shop/privkey.pem;
    return 301 https://qtienda.shop$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qtienda.shop;

    ssl_certificate     /etc/letsencrypt/live/qtienda.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qtienda.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10M;

    location /uploads/ {
        proxy_pass       http://127.0.0.1:8001/uploads/;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass   http://127.0.0.1:8001/health;
        access_log   off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================================
# qsdsoft.com  — proxy al container qsdsoft-web (puerto interno 8181)
# Requiere cambiar el docker-compose de qsdsoft:
#   ports: ["127.0.0.1:8181:80"]   (antes era "80:80")
# ============================================================

server {
    listen 443 ssl http2;
    server_name www.qsdsoft.com;
    ssl_certificate     /etc/letsencrypt/live/qsdsoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qsdsoft.com/privkey.pem;
    return 301 https://qsdsoft.com$request_uri;
}

