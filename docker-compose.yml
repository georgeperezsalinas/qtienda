version: "3.9"

services:

  api:
    build: ./backend
    container_name: qtienda_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPLOADS_DIR: /app/data/uploads
      UPLOADS_BASE_URL: https://qtienda.shop/uploads
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://qtienda.shop/api/v1
        NEXT_PUBLIC_CDN_URL: ${CDN_URL:-}
        NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${CULQI_PUBLIC_KEY:-}
    container_name: qtienda_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api
    logging:
      options:
        max-size: "10m"
        max-file: "3"

# Red compartida donde vive siscont_db.
# Se pre-crea manualmente en deploy.sh para que sea permanente
# (no se elimina cuando siscont-erp hace docker compose down).
networks:
  default:
    external: true
    name: siscont-erp_default
