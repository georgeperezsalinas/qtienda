version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: qtienda_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    container_name: qtienda_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - uploads_data:/tmp/qtienda-uploads
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://qtienda.shop/api/v1
        NEXT_PUBLIC_CDN_URL:
    container_name: qtienda_web
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - api
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads_data:
    driver: local

networks:
  default:
    external: true
    name: siscont-erp_default